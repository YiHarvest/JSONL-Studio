name: Build release artifacts
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            args: --target aarch64-apple-darwin --bundles dmg
          - os: ubuntu-24.04
            args: --bundles appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libgtk-3-dev librsvg2-dev patchelf
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: ${{ matrix.args }}
      - name: Collect artifacts and SHA256SUMS
        shell: bash
        run: |
          mkdir -p release-artifacts
          find src-tauri/target -type f \( -name '*.dmg' -o -name '*.AppImage' \) -exec cp {} release-artifacts/ \;
          cd release-artifacts
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            shasum -a 256 *.dmg > SHA256SUMS
          else
            sha256sum *.AppImage > SHA256SUMS
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: jsonl-studio-${{ runner.os }}
          path: release-artifacts/
