name: Preview installers
on:
  pull_request:
    paths:
      [
        "src-tauri/**",
        "src/**",
        "package*.json",
        "scripts/release.mjs",
        "scripts/release.test.mjs",
        ".github/workflows/release.yml",
      ]
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      macos: ${{ steps.signing.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: version
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          version=$(node scripts/release.mjs version "$RELEASE_TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: signing
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          ENABLED: ${{ vars.MACOS_PUBLIC_RELEASE_ENABLED }}
        run: |
          ready=false
          if [[ "$ENABLED" == "true" && -n "$CERT" && -n "$CERT_PASSWORD" && -n "$IDENTITY" && -n "$APPLE_ID" && -n "$APPLE_PASSWORD" && -n "$TEAM" ]]; then
            ready=true
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          echo "Signed macOS public release enabled: $ready" >> "$GITHUB_STEP_SUMMARY"
  linux:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libgtk-3-dev librsvg2-dev patchelf libfuse2t64 xvfb
      - run: npm ci
      - run: node --test scripts/release.test.mjs
      - run: npm run lint && npm test && npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - uses: tauri-apps/tauri-action@v0
        with:
          args: --bundles appimage
      - run: node scripts/release.mjs collect src-tauri/target/release/bundle linux-x86_64
      - name: Launch packaged executable without a development server
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          chmod +x release-artifacts/*.AppImage
          cd release-artifacts
          ./*.AppImage --appimage-extract >/dev/null
          set +e
          timeout 15s xvfb-run -a squashfs-root/AppRun > smoke.log 2>&1
          status=$?
          set -e
          cat smoke.log
          test "$status" -eq 124
          rm -rf squashfs-root smoke.log
      - uses: actions/upload-artifact@v4
        with:
          name: installer-linux
          path: release-artifacts/
          if-no-files-found: error
  macos:
    needs: prepare
    if: github.event_name == 'pull_request' || needs.prepare.outputs.macos == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build unsigned macOS review installer
        if: github.event_name == 'pull_request'
        run: |
          env -u APPLE_CERTIFICATE -u APPLE_CERTIFICATE_PASSWORD \
            -u APPLE_SIGNING_IDENTITY -u APPLE_ID -u APPLE_PASSWORD \
            -u APPLE_TEAM_ID -u APPLE_API_KEY -u APPLE_API_ISSUER \
            -u APPLE_API_KEY_PATH \
            npm run tauri build -- --target aarch64-apple-darwin --bundles dmg
      - uses: tauri-apps/tauri-action@v0
        if: github.event_name != 'pull_request'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: --target aarch64-apple-darwin --bundles dmg
      - if: github.event_name != 'pull_request'
        run: |
          app=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -name '*.app' -maxdepth 1 -print -quit)
          codesign --verify --deep --strict "$app"
          spctl --assess --type execute "$app"
          xcrun stapler validate "$app"
          dmg=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
      - run: node scripts/release.mjs collect src-tauri/target/aarch64-apple-darwin/release/bundle macos-aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: release-artifacts/
          if-no-files-found: error
  publish:
    needs: [prepare, linux, macos]
    if: always() && startsWith(github.ref, 'refs/tags/') && needs.prepare.result == 'success' && needs.linux.result == 'success' && (needs.macos.result == 'success' || needs.macos.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: release-artifacts
      - run: node scripts/release.mjs verify release-artifacts
      - name: Publish verified preview assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          assets=(release-artifacts/*.AppImage release-artifacts/SHA256SUMS)
          if compgen -G 'release-artifacts/*.dmg' > /dev/null; then
            assets+=(release-artifacts/*.dmg)
          fi
          gh release create "$TAG" "${assets[@]}" --verify-tag --title "JSONL Studio $TAG" --notes-file docs/releases/preview.md "${flags[@]}"
